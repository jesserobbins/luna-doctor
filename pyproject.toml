[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-doctor"
dynamic = ["version"]
description = "Diagnose LunaRoute concurrency problems from local agent logs, and emit per-agent config fixes"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jesse Robbins", email = "jesse.robbins@openaid.org" }]
keywords = ["lunaroute", "concurrency", "agents", "diagnostics", "pi", "claude-code", "codex"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://jesserobbins.com"

[project.scripts]
luna-doctor = "luna_doctor.cli:main"

[tool.setuptools]
# The CLI, `fix` and `chart` all ship as one package. They have to be installed
# together: `cli` loads its two sibling command files off disk, so installing it
# as a lone script left `fix` and `chart` reporting "support missing".
packages = ["luna_doctor"]

# VERSION holds a semver string (e.g. 0.1.1-alpha.1); normalize to PEP 440 for
# packaging so `pip install .` does not choke on the hyphenated prerelease.
# Keep the mapping trivial (alpha.1 -> a1) — `luna-doctor --version` always
# reports the semver form, which is the canonical one.
[tool.setuptools.dynamic]
version = { file = "VERSION" }
