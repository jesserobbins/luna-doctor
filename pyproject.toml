[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "luna-doctor"
dynamic = ["version"]
description = "Diagnose LunaRoute concurrency problems from local agent logs, and emit per-agent config fixes"
readme = "README.md"
requires-python = ">=3.9"
# PEP 639: the license is an SPDX expression, and the text ships beside it.
# A `{ file = "LICENSE" }` table puts the whole Apache text into the `License:`
# metadata field, which PyPI then renders as a wall of boilerplate.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jesse Robbins", email = "jesse.robbins@openaid.org" }]
keywords = ["lunaroute", "concurrency", "agents", "diagnostics", "pi", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/jesserobbins/luna-doctor"
Documentation = "https://github.com/jesserobbins/luna-doctor/blob/main/README.md"
Repository = "https://github.com/jesserobbins/luna-doctor"
Issues = "https://github.com/jesserobbins/luna-doctor/issues"
Changelog = "https://github.com/jesserobbins/luna-doctor/blob/main/CHANGELOG.md"

[project.scripts]
luna-doctor = "luna_doctor.cli:main"

[tool.setuptools]
# The CLI, `fix` and `chart` all ship as one package. They have to be installed
# together: `cli` loads its two sibling command files off disk, so installing it
# as a lone script left `fix` and `chart` reporting "support missing".
packages = ["luna_doctor"]

# VERSION holds a semver string (e.g. 0.1.1-alpha.1); normalize to PEP 440 for
# packaging so `pip install .` does not choke on the hyphenated prerelease.
# Keep the mapping trivial (alpha.1 -> a1) — `luna-doctor --version` always
# reports the semver form, which is the canonical one.
[tool.setuptools.dynamic]
version = { file = "VERSION" }
